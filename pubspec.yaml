name: tsunagaru_call
description: "つながる電話 - 家族・身内向け通話＆連絡アプリ（第1〜6ステップ強化版）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Step 1-2: Call, Network, Launcher, Update, Local Storage
  livekit_client: ^2.3.1
  flutter_webrtc: ^0.12.12+hotfix.1
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.3
  http: ^1.2.2
  # Step 5: Biometric/PIN Lock, QR/ID, Voice, Lightweight Video, Unlimited Files
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.6
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  record: ^6.0.0
  just_audio: ^0.9.42
  video_player: ^2.9.2
  open_filex: ^4.5.0
  path_provider: ^2.1.5
  # Step 6: Firebase Cloud Sync, Functions & Background Incoming Call Notifications
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
