name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Normalize pubspec.yaml & Generate Android project
        run: |
          python3 -c '
          import re
          p = "pubspec.yaml"
          txt = open(p, encoding="utf-8").read()
          txt = re.sub(r"flutter_webrtc:\s*\^?[0-9a-zA-Z.+_-]+", "flutter_webrtc: ^0.12.12+hotfix.1", txt)
          txt = re.sub(r"livekit_client:\s*\^?[0-9a-zA-Z.+_-]+", "livekit_client: ^2.3.1", txt)
          open(p, "w", encoding="utf-8").write(txt)
          '
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name tsunagaru_call --org jp.tsunagarucall
          fi

      - name: Auto-upgrade Android SDK, AGP, Kotlin & Gradle for compatibility
        run: |
          if [ -f "native-config/android/patch_manifest.py" ]; then
            python3 native-config/android/patch_manifest.py
          fi
          python3 -c '
          import glob, re

          AGP_VER = "8.7.3"
          KOTLIN_VER = "2.1.0"
          GRADLE_VER = "8.9"
          SDK_VER = "35"

          def bump_ver(match, target):
              prefix, ver = match.group(1), match.group(2)
              parts = lambda s: [int(x) for x in re.findall(r"\d+", s)]
              if parts(ver) < parts(target):
                  return f"{prefix}{target}"
              return match.group(0)

          for path in glob.glob("android/**/*", recursive=True):
              if path.endswith(("build.gradle", "build.gradle.kts", "settings.gradle", "settings.gradle.kts", "gradle.properties")):
                  txt = open(path, encoding="utf-8").read()
                  txt = re.sub(r"(com\.android\.application[\"'\'']?\s*(?:version)?\s*[\"'\''])([0-9]+\.[0-9]+\.[0-9]+)", lambda m: bump_ver(m, AGP_VER), txt)
                  txt = re.sub(r"(com\.android\.library[\"'\'']?\s*(?:version)?\s*[\"'\''])([0-9]+\.[0-9]+\.[0-9]+)", lambda m: bump_ver(m, AGP_VER), txt)
                  txt = re.sub(r"(com\.android\.tools\.build:gradle:)([0-9]+\.[0-9]+\.[0-9]+)", lambda m: bump_ver(m, AGP_VER), txt)
                  txt = re.sub(r"(org\.jetbrains\.kotlin\.android[\"'\'']?\s*(?:version)?\s*[\"'\''])([0-9]+\.[0-9]+\.[0-9]+)", lambda m: bump_ver(m, KOTLIN_VER), txt)
                  txt = re.sub(r"(kotlin-gradle-plugin:)([0-9]+\.[0-9]+\.[0-9]+)", lambda m: bump_ver(m, KOTLIN_VER), txt)
                  txt = re.sub(r"(ext\.kotlin_version\s*=\s*[\"'\''])([0-9]+\.[0-9]+\.[0-9]+)([\"'\''])", lambda m: f"{m.group(1)}{KOTLIN_VER if [int(x) for x in m.group(2).split(\".\")] < [int(x) for x in KOTLIN_VER.split(\".\")] else m.group(2)}{m.group(3)}", txt)
                  txt = re.sub(r"(compileSdk\s*=?\s*)([0-9]+)", lambda m: bump_ver(m, SDK_VER), txt)
                  txt = re.sub(r"(targetSdk\s*=?\s*)([0-9]+)", lambda m: bump_ver(m, SDK_VER), txt)
                  txt = re.sub(r"(compileSdkVersion\s+)([0-9]+)", lambda m: bump_ver(m, SDK_VER), txt)
                  txt = re.sub(r"(targetSdkVersion\s+)([0-9]+)", lambda m: bump_ver(m, SDK_VER), txt)
                  open(path, "w", encoding="utf-8").write(txt)

          wp = "android/gradle/wrapper/gradle-wrapper.properties"
          try:
              wtxt = open(wp, encoding="utf-8").read()
              wtxt = re.sub(r"gradle-([0-9.]+)-(bin|all)\.zip", lambda m: f"gradle-{GRADLE_VER if [int(x) for x in m.group(1).split(\".\")] < [int(x) for x in GRADLE_VER.split(\".\")] else m.group(1)}-{m.group(2)}.zip", wtxt)
              open(wp, "w", encoding="utf-8").write(wtxt)
          except FileNotFoundError:
              pass
          '

      - name: Install Flutter packages & Build Debug APK
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsunagaru-line-flutter-phase4-apk
          path: build/app/outputs/flutter-apk/*.apk
