name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Normalize pubspec.yaml & Generate Android project
        run: |
          python3 -c '
          import re
          p = "pubspec.yaml"
          txt = open(p, encoding="utf-8").read()
          txt = re.sub(r"flutter_webrtc:\s*\^?[0-9a-zA-Z.+_-]+", "flutter_webrtc: ^0.12.12+hotfix.1", txt)
          txt = re.sub(r"livekit_client:\s*\^?[0-9a-zA-Z.+_-]+", "livekit_client: ^2.3.1", txt)
          open(p, "w", encoding="utf-8").write(txt)
          '
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name tsunagaru_call --org jp.tsunagarucall
          fi

      - name: Patch AndroidManifest, Gradle SDK, AGP, Kotlin & ringtones
        run: |
          if [ -f "native-config/android/patch_manifest.py" ]; then
            python3 native-config/android/patch_manifest.py
          fi
          python3 -c '
          import glob, re
          for path in glob.glob("android/**/*", recursive=True):
            if path.endswith(("build.gradle", "build.gradle.kts", "settings.gradle", "settings.gradle.kts")):
              txt = open(path, encoding="utf-8").read()
              txt = re.sub(r"(com\.android\.application[\"'\'']?\s*(?:version)?\s*[\"'\''])8\.[0-5]\.[0-9]+", r"\g<1>8.6.0", txt)
              txt = re.sub(r"(com\.android\.library[\"'\'']?\s*(?:version)?\s*[\"'\''])8\.[0-5]\.[0-9]+", r"\g<1>8.6.0", txt)
              txt = re.sub(r"(com\.android\.tools\.build:gradle:)8\.[0-5]\.[0-9]+", r"\g<1>8.6.0", txt)
              txt = re.sub(r"(org\.jetbrains\.kotlin\.android[\"'\'']?\s*(?:version)?\s*[\"'\''])[0-9]+\.[0-9]+\.[0-9]+", r"\g<1>2.0.20", txt)
              txt = re.sub(r"(kotlin-gradle-plugin:)([0-9]+\.[0-9]+\.[0-9]+)", r"\g<1>2.0.20", txt)
              txt = re.sub(r"(ext\.kotlin_version\s*=\s*[\"'\''])[0-9]+\.[0-9]+\.[0-9]+([\"'\''])", r"\g<1>2.0.20\g<2>", txt)
              txt = re.sub(r"(compileSdk\s*=?\s*)3[0-4]", r"\g<1>35", txt)
              txt = re.sub(r"(targetSdk\s*=?\s*)3[0-4]", r"\g<1>35", txt)
              open(path, "w", encoding="utf-8").write(txt)
          wp = "android/gradle/wrapper/gradle-wrapper.properties"
          try:
            wtxt = open(wp, encoding="utf-8").read()
            wtxt = re.sub(r"gradle-[0-9.]+-(bin|all)\.zip", r"gradle-8.7-\1.zip", wtxt)
            open(wp, "w", encoding="utf-8").write(wtxt)
          except FileNotFoundError:
            pass
          '

      - name: Install Flutter packages & Build Debug APK
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsunagaru-line-flutter-phase4-apk
          path: build/app/outputs/flutter-apk/*.apk
