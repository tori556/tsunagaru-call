name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Normalize pubspec.yaml & Generate Android project
        run: |
          python3 -c '
          import re
          p = "pubspec.yaml"
          txt = open(p, encoding="utf-8").read()
          txt = re.sub(r"flutter_webrtc:\s*\^?[0-9a-zA-Z.+_-]+", "flutter_webrtc: ^0.12.12+hotfix.1", txt)
          txt = re.sub(r"livekit_client:\s*\^?[0-9a-zA-Z.+_-]+", "livekit_client: ^2.3.1", txt)
          open(p, "w", encoding="utf-8").write(txt)
          '
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name tsunagaru_call --org jp.tsunagarucall
          fi

      - name: Patch AndroidManifest, Gradle SDK & copy category ringtones
        run: |
          if [ -f "native-config/android/patch_manifest.py" ]; then
            python3 native-config/android/patch_manifest.py
          fi

      - name: Install Flutter packages & Build Debug APK
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsunagaru-line-flutter-phase4-apk
          path: build/app/outputs/flutter-apk/*.apk
